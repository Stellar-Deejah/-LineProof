version: "3.9"

services:
  stellar-core:
    image: stellar/quickstart:latest
    platform: linux/amd64
    ports:
      - "8000:8000"
      - "11625:11625"
      - "11626:11626"
    environment:
      - NETWORK=local
    command: --local --enable-soroban-rpc
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  soroban-rpc:
    image: stellar/soroban-rpc:latest
    platform: linux/amd64
    depends_on:
      stellar-core:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SOROBAN_RPC_STELLAR_CORE_URL=http://stellar-core:11626
      - SOROBAN_RPC_NETWORK_PASSPHRASE=Standalone Network ; February 2017
      - SOROBAN_RPC_FRIENDBOT_URL=http://stellar-core:8000/friendbot
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Note: postgres service removed until issue #9 (database persistence layer) is implemented.
  # The local stack backend currently runs using in-memory state.

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    depends_on:
      soroban-rpc:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      SOROBAN_RPC_URL: http://soroban-rpc:8080
      STELLAR_NETWORK: STANDALONE
    volumes:
      - ../backend:/app
      - /app/node_modules
